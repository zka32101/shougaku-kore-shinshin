name: shougaku_kore_doutoku
description: "小学コレ！道徳 ～かっこいい大人になるために～。小学3-4年生が、日常のジレンマを選択肢型ストーリーで体験しながら、親向けの月次成長レポートで判断力の成長を見守るサブスク型道徳学習アプリ。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Shared Core (小学コレシリーズ共通)
  shared_core:
    path: ../shared_core

  # Firebase
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.5.4
  firebase_analytics: ^11.6.0
  firebase_messaging: ^15.2.10
  google_sign_in: ^7.2.0
  # flutter_local_notifications: (disabled for build - use FCM only)

  # HTTP & API
  dio: ^5.4.0

  # Local Storage & Caching
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  cached_network_image: ^4.0.0

  # JSON Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.0

  # Audio & Narration
  audioplayers: ^6.8.1
  flutter_tts: ^4.0.2

  # Charting (for radar chart in parent report)
  fl_chart: ^1.2.0

  # Environment variables
  flutter_dotenv: ^6.0.1

  # Localization
  intl: ^0.20.3

  # Secure Storage (for tokens)
  flutter_secure_storage: ^11.1.1

  # In-App Purchase
  in_app_purchase: ^3.1.0
  in_app_purchase_android: ^0.5.3
  in_app_purchase_storekit: ^0.4.13

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

  # Code Generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  analyzer: ^7.6.0

  # Test helpers
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
  # mockito: ^5.8.0  # Temporarily removed for analyzer 8.0+ compatibility
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  # fonts:
  #   - family: NotoSansJP
  #     fonts:
  #       - asset: assets/fonts/NotoSansJP-Regular.ttf
  #       - asset: assets/fonts/NotoSansJP-Bold.ttf
  #         weight: 700
  # TODO: Download NotoSansJP fonts from Google Fonts and place in assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
